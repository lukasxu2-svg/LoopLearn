services:

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile.dev
    ports:
      - "5174:5174"
    env_file:
      - ./front_end/.env.developement
    volumes:
      - ./front_end:/app
      - /app/node_modules
    command: npm run dev -- --host 0.0.0.0
  
  backend:
    build:
      context: ./back_end
      dockerfile: Dockerfile.dev
    ports:
      - "8080:8080"
    env_file:
      - ./back_end/.env.dev
    command: ./mvnw spring-boot:run
    depends_on:
      db:
        condition: service_healthy

  ngrok:
    image: ngrok/ngrok:latest
    command: http backend:8080 --log stdout
    env_file:
      - ./back_end/.env.dev
    depends_on:
      - backend

  db:
    image: postgres:17
    env_file:
      - ./back_end/.env.dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: