spring.application.name=saasTest

#JWT Settings
jwt.secret=${JWT_SECRET}
jwt.token.refresh.timer=${JWT_TOKEN_REFRESH_TIMER}

# Postgres Settings
spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${POSTGRES_DB}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA Settings
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Paypal Settings
paypal.client.id=${PAYPAL_CLIENT_ID}
paypal.client.secret=${PAYPAL_CLIENT_SECRET}
paypal.sandbox.base.url=${PAYPAL_SANDBOX_URL}
paypal.webhook.id=${PAYPAL_WEBHOOK_ID}

# Paypal Product Id
paypal.product.id.free=${FREE_PRODUCT_ID}
paypal.product.id.basic=${BASIC_PRODUCT_ID}
paypal.product.id.premium=${PREMIUM_PRODUCT_ID}

# Paypal Plan Id
paypal.plan.id.free=${FREE_PRODUCT_ID}
paypal.plan.id.basic=${BASIC_PRODUCT_ID}
paypal.plan.id.premium=${PREMIUM_PRODUCT_ID}
