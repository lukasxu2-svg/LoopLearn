services:

  frontend:
    build:
      context: ./front_end
      dockerfile: Dockerfile
    restart: unless-stopped
    expose:
      - "80"

  backend:
    build:
      context: ./back_end
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - ./back_end/.env
    environment:
      DB_HOST: ${DB_HOST}
      DB_PORT: 5432
    expose:
      - "8080"

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend