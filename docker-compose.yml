services:

  frontend:
    build: ./front_end
    ports:
      - "5174:5174"
    volumes:
      - ./front_end:/app
      - /app/node_modules
  
  backend:
    build: ./back_end
    ports:
      - "8080:8080"
    env_file:
      - ./back_end/.env
    environment:
      DB_HOST: db
      DB_PORT: 5432
    depends_on:
      db:
        condition: service_healthy

  db:
    image: postgres:17
    env_file:
      - ./back_end/.env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data: